<text x="825" y="734" font-size="13" fill="#475569">JSON response</text>
<rect x="32" y="810" width="1136" height="100" rx="16" fill="#0f172a"/>
<text x="54" y="840" font-size="13" fill="#93c5fd" font-weight="700">READING THE DIAGRAM</text>
<text x="54" y="866" font-size="16" fill="#f8fafc">Solid arrows: request / response flow     Dashed arrows: template fallback</text>
<text x="54" y="891" font-size="15" fill="#cbd5e1">Historical context is bundled with the app. No live archive retrieval or persistent letter database.</text>
</g></svg>