<text x="370" y="382" font-size="12" fill="#64748b" font-weight="700">POST</text>
<path d="M 774 306 H 846" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M 774 451 H 810 V 340 H 846" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
